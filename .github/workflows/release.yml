# Baut bei jedem Versions-Tag (v1.2.3) ModStaller fuer Linux und Windows und
# veroeffentlicht alles als eine GitHub-Release. Die Apps holen sich Updates
# genau von dort (electron-updater liest latest-linux.yml bzw. latest.yml).
#
# Ausloesen:  ./release.sh 1.2.3   (oder von Hand: git tag v1.2.3 && git push origin v1.2.3)
# Tags mit Bindestrich (v1.3.0-beta.1) werden als Vorabversion markiert -
# die bekommen nur Nutzer, die selbst eine Vorabversion laufen haben.
#
# Probelauf ohne Veroeffentlichung: Actions -> Release -> "Run workflow".
# Die Builds liegen dann als Artefakte am Lauf.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZSIGN_REF: v1.1.1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Das Annotations-Plugin haengt jeden Fehlschlag als Annotation an den
      # Lauf - die sind im Gegensatz zu den Logs auch ohne Anmeldung lesbar.
      - name: Python-Tests
        run: |
          pip install -e . pytest pytest-asyncio pytest-github-actions-annotate-failures
          pytest -q

      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Oberflaeche pruefen und testen
        if: runner.os == 'Linux'
        working-directory: gui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check --tsconfig ./tsconfig.json
          npm test

  build-linux:
    name: Linux (AppImage)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # Der Tag ist die Wahrheit - auch wenn jemand vergessen hat, die
      # Nummer im Repo hochzuzaehlen. Sonst meldete die neue Version die
      # alte Nummer und boete sich selbst ewig als Update an.
      - name: Version aus dem Tag uebernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/set-version.py "${GITHUB_REF_NAME#v}"

      # Dasselbe Skript wie lokal: Backend und zsign im Ubuntu-22.04-
      # Container (alte glibc = laeuft auf moeglichst vielen Distros).
      - name: AppImage bauen
        run: ./buildscripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  build-windows:
    name: Windows (Setup + CLI)
    needs: test
    # Fest 2022: zsigns Projekt verlangt das VS2022-Toolset (v143).
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Version aus dem Tag uebernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/set-version.py "${GITHUB_REF_NAME#v}"

      # zsign bringt eine VS2022-Solution mit statischem OpenSSL und
      # statischer C-Laufzeit mit - die .exe braucht nichts weiter.
      # PowerShell statt Bash: MSBuild wird per vswhere gefunden, und Fehler
      # landen als Annotation am Lauf (die sind ohne Anmeldung lesbar).
      - name: zsign bauen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "zsign"
          git clone -q --depth 1 --branch $env:ZSIGN_REF https://github.com/zhlynn/zsign.git $src
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { Write-Output "::error::MSBuild nicht gefunden"; exit 1 }
          Write-Output "MSBuild: $msbuild"
          $log = & $msbuild (Join-Path $src "build\windows\vs2022\zsign.sln") -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal 2>&1
          $log | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $log | Select-String -Pattern "error" | Select-Object -First 6 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }
          $exe = Get-ChildItem (Join-Path $src "build\windows") -Recurse -Filter zsign.exe |
            Where-Object FullName -like "*Release*" | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::zsign.exe nach dem Build nicht gefunden"; exit 1 }
          New-Item -ItemType Directory -Force packaging\out\bin | Out-Null
          Copy-Item $exe.FullName packaging\out\bin\zsign.exe
          & packaging\out\bin\zsign.exe -v

      - name: Backend und CLI bauen (PyInstaller)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          pip install . "pyinstaller>=6.10"
          python packaging/build_backend.py --out packaging/out --cli

      # Control Flow Guard muss aus den Programmen heraus sein - sonst bricht
      # die Anisette-Emulation nativ ab (0xC0000409) und reisst das Backend
      # mit. Der Schritt dazu steht in packaging/build_backend.py; hier wird
      # nachgesehen, ob er wirklich gelaufen ist.
      - name: Control Flow Guard pruefen
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          python - <<'PY'
          import struct, sys
          from pathlib import Path

          bad = []
          for p in (Path("packaging/out/backend/modstaller-backend.exe"),
                    Path("packaging/out/cli/modstaller.exe")):
              d = p.read_bytes()
              pe = struct.unpack_from("<I", d, 0x3C)[0]
              flags, = struct.unpack_from("<H", d, pe + 24 + 70)
              print(f"{p}: DllCharacteristics=0x{flags:04x}")
              if flags & 0x4000:
                  bad.append(str(p))
          if bad:
              print("::error::Control Flow Guard noch gesetzt: " + ", ".join(bad))
              sys.exit(1)
          PY

      # Bis 1.1.0-beta.3 wurde hier nur "info" abgefragt - und das fasst weder
      # pymobiledevice3 noch anisette noch unicorn an. Der Rauchtest spricht
      # deshalb dasselbe Protokoll wie die Oberflaeche und ruft auch "doctor".
      - name: Backend pruefen
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          packaging/out/cli/modstaller.exe --help > /dev/null

          out=$(python packaging/smoke_backend.py packaging/out/backend/modstaller-backend.exe) || {
            echo "$out"; echo "::error::Rauchtest des Backends fehlgeschlagen"; exit 1; }
          echo "$out"
          # Ein Windows-Build, der sich fuer POSIX haelt, legt seine Daten am
          # falschen Ort ab und prueft Unix-Rechte, die es hier nicht gibt.
          echo "$out" | grep -q '"posix": false' || {
            echo "::error::Backend meldet POSIX-Verhalten unter Windows"; exit 1; }

          python packaging/smoke_backend.py packaging/out/cli/modstaller.exe || {
            echo "::error::Rauchtest der CLI fehlgeschlagen"; exit 1; }

      - name: Installer bauen
        working-directory: gui
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          npm ci --no-audit --no-fund
          npm run dist:win

      # extraResources schlaegt nicht fehl, wenn die Quelle leer ist - dann
      # laege ein Installer ohne Backend vor, und das faellt erst beim Nutzer auf.
      - name: Backend im Installer pruefen
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          res=dist/win-unpacked/resources
          test -f "$res/backend/modstaller-backend.exe" || { echo "::error::modstaller-backend.exe fehlt im Build"; exit 1; }
          test -d "$res/backend/_internal" || { echo "::error::_internal fehlt neben modstaller-backend.exe"; exit 1; }
          test -f "$res/bin/zsign.exe" || { echo "::error::zsign.exe fehlt im Build"; exit 1; }

      - name: CLI-Zip packen
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          version=$(python -c "import json;print(json.load(open('gui/package.json'))['version'])")
          cd packaging/out
          cp bin/zsign.exe cli/
          7z a -tzip "../../dist/ModStaller-CLI-${version}-windows-x64.zip" ./cli/*

      # Die Logs sind nur angemeldet lesbar, Annotationen oeffentlich - so
      # laesst sich ein Fehlschlag auch von aussen nachvollziehen.
      - name: Fehler als Annotation melden
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/build.log" || exit 0
          tail -n 10 "$RUNNER_TEMP/build.log" | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.zip

  publish:
    name: Release veroeffentlichen
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Beide Update-Dateien muessen die Tag-Version nennen - sonst boete
      # eine Plattform ihren Nutzern die falsche Version an.
      - name: Update-Metadaten pruefen
        run: |
          ls -la dist/
          for f in latest-linux.yml latest.yml; do
            grep -q "^version: ${GITHUB_REF_NAME#v}$" "dist/$f" || { echo "$f passt nicht zum Tag"; exit 1; }
          done

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: ModStaller ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          # Linux: Blockmap steckt in der AppImage. Windows: eigene .blockmap.
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.zip
