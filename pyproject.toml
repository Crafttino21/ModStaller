[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modstaller"
version = "1.3.1"
description = "Multi-platform iOS sideloader: sign IPAs and install them on your iPhone"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pymobiledevice3>=11.17,<12",
    "anisette>=1.2.4",
    "cryptography>=43",
    "requests>=2.31",
    "quickjs-ng>=0.16",
]

[project.scripts]
modstaller = "modstaller.cli:main"

[tool.setuptools.packages.find]
include = ["modstaller*"]

[tool.setuptools.package-data]
"modstaller.apple" = ["certs/*.pem"]
"modstaller" = ["locale/*.json"]
"modstaller.device" = ["*.js"]
